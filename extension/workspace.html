<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokerJam ICM</title>
  <link rel="stylesheet" href="workspace.css">
  <script type="module" src="workspace.mjs"></script>
</head>
<body class="jam-popup">
  <main inert>
    <header>
      <div class="popup-heading">
        <small id="installed-version"></small>
        <h1>PokerJam ICM</h1>
      </div>
      <button id="check-update" class="settings-button" type="button" aria-label="更新を確認" title="更新を確認">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 5v5h-5M4 19v-5h5"/>
          <path d="M4.6 9a8 8 0 0 1 13.2-2.6L20 10M4 14l2.2 3.6A8 8 0 0 0 19.4 15"/>
        </svg>
      </button>
    </header>
    <div class="update-result">
      <p id="update-status" class="status" role="status"></p>
      <a id="open-updater" href="update.html" hidden>更新を適用する</a>
      <a id="update-release" target="_blank" rel="noopener noreferrer" hidden>Releaseページを開く</a>
      <p id="update-toast" class="toast update-toast" role="status"></p>
    </div>

    <section class="site-guide" id="site-guide" aria-labelledby="site-guide-title" hidden>
      <h2 id="site-guide-title">入力先を開く</h2>
      <p>入力先のタブで、この拡張機能のアイコンをもう一度クリックしてください。</p>
      <a class="primary-link" href="https://zenosolver.com/study" target="_blank" rel="noopener noreferrer">ZenoSolverを開く</a>
      <a class="primary-link" href="https://app.gtowizard.com/solutions?soltab=strategy" target="_blank" rel="noopener noreferrer">GTO Wizardを開く</a>
    </section>

    <div class="layout" id="workspace" hidden>
      <section aria-labelledby="settings-title">
        <form id="settings">
          <div class="settings-heading">
            <h2 id="settings-title">トーナメント設定</h2>
            <label class="final-table-option">
              <input id="final-table" type="checkbox" aria-describedby="final-table-hint">
              FT想定
            </label>
            <span id="final-table-hint" class="sr-only">選んだハンドの着席人数を残り人数として使います。</span>
          </div>
          <div class="player-counts">
            <div id="remaining-field">
              <label for="remaining">残り人数</label>
              <input id="remaining" type="text" inputmode="numeric" pattern="[0-9]+" required>
            </div>
            <div>
              <label for="entries">総エントリー数</label>
              <input id="entries" type="text" inputmode="numeric" pattern="[0-9]+" required>
            </div>
          </div>
          <p id="final-table-count" class="final-table-count" role="status" hidden></p>
          <p id="settings-status" class="status" role="status"></p>
          <small id="estimated-average" role="status" hidden></small>

          <div class="points-preview">
            <output for="entries" aria-labelledby="points-title">
              <span class="points-heading">
                <span id="points-title">成績ポイント</span>
                <span id="itm-count" hidden></span>
              </span>
              <span class="points-summary">
                <span class="points-metric">
                  <span class="points-label">1位</span>
                  <span id="first-points" class="points-value">—</span>
                </span>
                <span class="points-metric">
                  <span class="points-label">1順位アップ</span>
                  <span id="rank-increase" class="points-value">—</span>
                </span>
                <span class="points-metric">
                  <span class="points-label">入賞最下位</span>
                  <span id="last-points" class="points-value">—</span>
                </span>
              </span>
            </output>
          </div>
        </form>
      </section>

      <section id="history-panel" aria-labelledby="history-title">
        <h2 id="history-title">ハンド履歴</h2>
        <input id="history-paste-target" type="text" aria-label="ハンド履歴を貼り付け"
          placeholder="ここにハンド履歴を貼り付け" autocomplete="off" spellcheck="false">
        <div class="history-actions">
          <button id="open-history-file" type="button" class="settings-button">ファイルを選ぶ</button>
          <input id="history-file" type="file" accept=".txt,.log,.hh,text/plain" hidden>
          <small>ここにファイルをドロップできます</small>
        </div>
        <div id="history-picker" hidden>
          <label id="history-picker-label" for="history-select">表示するハンド</label>
          <select id="history-select"></select>
        </div>
        <p id="history-status" class="status" role="status"></p>

        <div id="preview" hidden>
          <p id="blinds" class="blinds"></p>
          <table>
            <caption class="sr-only">開始スタック</caption>
            <thead>
              <tr><th scope="col">位置</th><th scope="col">チップ</th><th scope="col">BB</th></tr>
            </thead>
            <tbody id="players"></tbody>
          </table>
        </div>
        <details id="history-details" hidden>
          <summary>元の履歴</summary>
          <pre id="history-source" tabindex="0" aria-label="選択したハンドの元の履歴"></pre>
        </details>
      </section>

      <div class="solver-actions">
        <p id="send-toast" class="toast send-toast" role="status"></p>
        <button id="send" type="submit" form="settings" disabled>カスタムプリフロップツリーに入力</button>
        <p id="send-status" class="status" role="status"></p>
      </div>
    </div>
  </main>
</body>
</html>
