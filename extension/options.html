<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>詳細設定 | PokerJam ICM - ZenoSolver</title>
  <link rel="stylesheet" href="workspace.css">
  <script type="module" src="options.mjs"></script>
</head>
<body class="options">
  <main>
    <header>
      <h1>PokerJam ICM - ZenoSolver 詳細設定</h1>
    </header>
    <section aria-label="ICM設定">
      <form id="preferences" inert>
        <label for="point-rate">1ptの換算額</label>
        <select id="point-rate">
          <option value="10">$10</option>
          <option value="5">$5</option>
        </select>

        <div class="submit">
          <button id="save" type="submit">保存</button>
        </div>
      </form>
      <p id="options-status" class="status" role="status"></p>
    </section>
  </main>
</body>
</html>
